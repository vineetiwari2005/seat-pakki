server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://mysql-84ea1c2-iiits-67cc.i.aivencloud.com:15368/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:springpass123}

# Hibernate will create/update tables automatically based on @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Timezone Configuration - Ensures consistent timestamps
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB



spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email Notification Configuration (Externalized - Non-Hardcoded)
email.booking.enabled=true
email.wallet.enabled=true
email.cancellation.enabled=true

# Stripe Payment Gateway (TEST MODE - FREE)
# Get your test keys from: https://dashboard.stripe.com/test/apikeys
stripe.api.key=${STRIPE_SECRET_KEY:${STRIPE_API_KEY:}}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}

# Redis cache (movie/show data for today + next 3 days)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3s
app.cache.movie-show.ttl-hours=30

# Parking Pricing Configuration (Configurable - Non-Hardcoded)
# Prices are per hour in INR
parking.pricing.rates.TWO_WHEELER=30.0
parking.pricing.rates.FOUR_WHEELER=50.0
parking.pricing.rates.EV=40.0
parking.pricing.default-hours=4
parking.pricing.minimum-hours=1
parking.pricing.maximum-hours=12
parking.pricing.grace-period-minutes=15
parking.pricing.overstay-multiplier=1.5

# NOTE: Refund policy is now DATABASE-DRIVEN (see refund_rules table)
# Rules are fetched from database at runtime
# No hardcoded values - fully configurable via database

# OTP Configuration (for payment and sensitive profile updates)
otp.enabled=true
otp.expiry.minutes=5
otp.max.attempts=5

# Free third-party SMS OTP provider (Textbelt)
# Set TEXTBELT_API_KEY for higher limits in non-test mode
otp.sms.textbelt.url=https://textbelt.com/text
otp.sms.textbelt.key=${TEXTBELT_API_KEY:textbelt}

# India-friendly SMS provider (recommended)
otp.sms.fast2sms.url=https://www.fast2sms.com/dev/bulkV2
otp.sms.fast2sms.key=${FAST2SMS_API_KEY:}

# India-friendly free-trial SMS provider (primary)
otp.sms.twofactor.url=https://2factor.in/API/V1
otp.sms.twofactor.key=${TWOFACTOR_API_KEY:}

# Textlocal (India-friendly free-trial) - primary route
otp.sms.textlocal.url=https://api.textlocal.in/send/
otp.sms.textlocal.key=${TEXTLOCAL_API_KEY:}
otp.sms.textlocal.sender=${TEXTLOCAL_SENDER:TXTLCL}

# CircuitDigest Cloud provider (custom)
otp.sms.circuitdigest.url=${CIRCUITDIGEST_SMS_URL:https://www.circuitdigest.cloud/api/send-sms}
otp.sms.circuitdigest.key=${CIRCUITDIGEST_API_KEY:}

# Fallback when SMS provider is unavailable for region/country
otp.sms.fallback.enabled=true

# Temporary wallet credit validity (days) for Change Date flow
app.temp-wallet.validity-days=15

# Frontend URL for single-origin deployments (used as fallback when CORS_ALLOWED_ORIGINS is not set)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# CORS origins (comma-separated). If not provided, falls back to FRONTEND_URL + local dev defaults.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend.url},http://localhost:3001,http://localhost:5173,https://*.vercel.app}